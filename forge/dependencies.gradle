dependencies {
    modImplementation("net.blay09.mods:balm-forge:${balm_version}") {
        changing = balm_version.contains("SNAPSHOT")
    }
    modImplementation("net.blay09.mods:kuma-api-forge:${kuma_version}")
    modCompileOnly("com.simibubi.create:create-1.20.1:${create_forge_version}:slim") {
        transitive = false
    }

    // Keep compile/runtime resolution in Forge and Common.
    shadowIn("dev.arbjerg:lavaplayer:2.2.6") {
        exclude(group: "dev.arbjerg", module: "lavaplayer-natives")
    }
    shadowIn("dev.lavalink.youtube:v2:1.17.0")

    // Ensure LegacyForge dev runs include these on clientLegacyClasspath.
    // Without this, Forge can miss Lavaplayer classes/natives at runtime.
    additionalRuntimeClasspath("dev.arbjerg:lavaplayer:2.2.6")
    additionalRuntimeClasspath("dev.arbjerg:lavaplayer-natives:2.2.6")
    additionalRuntimeClasspath("dev.lavalink.youtube:v2:1.17.0")
}
