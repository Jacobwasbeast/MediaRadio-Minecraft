plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'net.darkhax.curseforgegradle'
    id "com.modrinth.minotaur"
    id "com.github.johnrengelman.shadow" version "8.1.1"
}

neoForge {
    version = neoforge_version

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.add(at.absolutePath)
    }

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        client {
            client()
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

configurations {
    shadowIn
    implementation.extendsFrom shadowIn
    devAudioLibs {
        canBeResolved = true
    }
}

// Merge lavaplayer + lavalink-youtube into one jar for dev runs.
// NeoForge's JPMS-based ModuleClassLoader rejects split packages, and these libraries
// legitimately share packages across artifacts, so they must live in a single module.
tasks.register('mergeDevAudioLibs', Jar) {
    archiveBaseName.set("${mod_id}-dev-audio-libs")
    archiveVersion.set("")
    destinationDirectory.set(layout.buildDirectory.dir("devAudioLibs"))
    from {
        configurations.devAudioLibs.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/MANIFEST.MF'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'module-info.class'
}

afterEvaluate {
    dependencies.add('additionalRuntimeClasspath', files(tasks.named('mergeDevAudioLibs').map { it.archiveFile }))
    tasks.matching { it.name.startsWith('run') || it.name.startsWith('prepareRun') }.configureEach {
        dependsOn('mergeDevAudioLibs')
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.apache.httpcomponents:httpclient:4.5.14'
        force 'org.apache.httpcomponents:httpcore:4.4.16'
    }
}

dependencies {
    annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add("-AdefaultObfuscationEnv=named:mojang")
}

jar {
    dependsOn(tasks.shadowJar)
    from {
        zipTree(tasks.shadowJar.archiveFile.get().asFile)
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest.attributes([
            "MixinConfigs": "${mod_id}.mixins.json,${mod_id}.neoforge.mixins.json"
    ])
}

shadowJar {
    archiveClassifier.set("shadow")
    configurations = [project.configurations.shadowIn]

    relocate 'org.json', "${project.group}.${mod_id}.shadow.org.json"
    relocate 'org.slf4j', "${project.group}.${mod_id}.shadow.org.slf4j"
    relocate 'certificates', "${project.group}.${mod_id}.shadow.certificates"
    relocate 'com.fasterxml', "${project.group}.${mod_id}.shadow.com.fasterxml"
    relocate 'org.jsoup', "${project.group}.${mod_id}.shadow.org.jsoup"
    relocate 'mozilla', "${project.group}.${mod_id}.shadow.mozilla"
    relocate 'net.iharder', "${project.group}.${mod_id}.shadow.net.iharder"
    relocate 'org.apache.http', "${project.group}.${mod_id}.shadow.org.apache.http"
    relocate('org.apache.commons', "${project.group}.${mod_id}.shadow.org.apache.commons") {
        include 'org.apache.commons.logging.**'
        include 'org.apache.commons.io.**'
        include 'org.apache.commons.codec.**'
    }
    relocate 'com.github', "${project.group}.${mod_id}.shadow.com.github"
    relocate 'com.alibaba', "${project.group}.${mod_id}.shadow.com.alibaba"
    relocate 'com.mpatric', "${project.group}.${mod_id}.shadow.com.mpatric"

    mergeServiceFiles {
        relocate 'javax.ws.rs.ext', "${project.group}.${mod_id}.shadow.javax.ws.rs.ext"
        relocate 'org.glassfish.jersey.internal.spi', "${project.group}.${mod_id}.shadow.org.glassfish.jersey.internal.spi"
    }

    relocate 'ibxm', "${project.group}.${mod_id}.shadow.ibxm"
    relocate 'net.sourceforge.jaad', "${project.group}.${mod_id}.shadow.net.sourceforge.jaad"
    relocate 'org.mozilla.javascript', "${project.group}.${mod_id}.shadow.org.mozilla.javascript"
    relocate 'org.mozilla.classfile', "${project.group}.${mod_id}.shadow.org.mozilla.classfile"
}

apply from: rootProject.file('repositories.gradle')
apply from: 'dependencies.gradle'

task curseforge(type: net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    dependsOn('build')
    description = 'Publishes the NeoForge build to CurseForge.'
    group = 'publishing'

    apiToken = project.findProperty("curseforge.api_key") ?: System.getenv("CURSEFORGE_TOKEN") ?: "none"

    def projectId = findProperty("curseforge_project_id")
    onlyIf {
        projectId != null
    }
    if (projectId) {
        def mainFile = upload(findProperty("curseforge_project_id"), file("${project.buildDir}/libs/${archivesBaseName}-${version}.jar"))
        mainFile.changelog = rootProject.file('CHANGELOG.md').text
        mainFile.addRequirement("balm")
        project.minecraft_versions.split(',').toList().each { mainFile.addGameVersion(it) }
        mainFile.releaseType = "release"
    }
}

modrinth {
    token = project.findProperty("modrinth.token") ?: System.getenv("MODRINTH_TOKEN") ?: "none"
    projectId = findProperty("modrinth_project_id")
    versionType = "release"
    versionNumber = project.version + "+neoforge-" + project.minecraft_version
    uploadFile = jar
    changelog = rootProject.file("CHANGELOG.md").text
    gameVersions = project.minecraft_versions.split(',').toList()
    syncBodyFrom = rootProject.file("modpage.md").text
    loaders = ['neoforge']
    dependencies {
        required.project "balm"
    }
}
